<!DOCTYPE html>
<html lang="id" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Penghuni')}"></head>
<body><aside th:replace="~{fragments :: sidebar}"></aside><div class="workspace"><header th:replace="~{fragments :: topbar}"></header><main id="main-content">
<div th:replace="~{fragments :: messages}"></div><div class="page-heading"><div><p class="eyebrow">CATATAN PENGHUNIAN</p><h1>Penghuni</h1><p class="muted">Data penghuni aktif dan riwayat yang sudah keluar.</p></div><a class="button" th:href="@{/residents/new}"><svg class="icon " aria-hidden="true" focusable="false"><use th:href="@{/icons.svg#plus}"></use></svg>Tambah penghuni</a></div>
<section class="panel"><form class="filters" th:action="@{/residents}" method="get"><label for="q">Cari nama atau kamar<input id="q" name="q" th:value="${q}" placeholder="Nama penghuni / nomor kamar"></label><button class="button secondary" type="submit"><svg class="icon " aria-hidden="true" focusable="false"><use th:href="@{/icons.svg#search}"></use></svg>Cari</button><a class="text-link" th:href="@{/residents}">Reset</a></form>
<div class="table-wrap"><table><thead><tr><th>Penghuni</th><th>Kamar</th><th>Tanggal masuk</th><th>Status</th><th>Tindakan</th></tr></thead><tbody>
<tr th:each="r : ${residents}"><td><strong th:text="${r.name}"></strong><small th:text="${r.phone}"></small></td><td th:text="${r.room.number}"></td><td th:text="${@display.date(r.moveIn)}"></td>
<td><span class="badge" th:classappend="${r.active ? 'green' : 'neutral'}" th:text="${r.active ? 'Aktif' : 'Keluar'}"></span><small th:if="${!r.active}" th:text="${@display.date(r.moveOut)}"></small></td>
<td><div class="actions"><a class="button small secondary" th:href="@{/residents/{id}/edit(id=${r.id})}"><svg class="icon " aria-hidden="true" focusable="false"><use th:href="@{/icons.svg#edit}"></use></svg>Edit</a><a th:if="${r.active}" class="button small secondary" th:href="@{/residents/{id}/checkout(id=${r.id})}">Catat keluar</a><form th:action="@{/residents/{id}/delete(id=${r.id})}" method="post" data-confirm="Hapus penghuni ini? Data yang sudah memiliki tagihan tidak dapat dihapus."><button class="button small danger" type="submit"><svg class="icon " aria-hidden="true" focusable="false"><use th:href="@{/icons.svg#trash}"></use></svg>Hapus</button></form></div></td></tr>
<tr th:if="${#lists.isEmpty(residents)}"><td colspan="5" class="empty">Belum ada penghuni yang sesuai. Pastikan kamar sudah ditambahkan sebelum mencatat penghuni.</td></tr>
</tbody></table></div></section></main></div></body></html>
