<!DOCTYPE html>
<html lang="id" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Rincian tagihan')}"></head>
<body><aside th:replace="~{fragments :: sidebar}"></aside><div class="workspace"><header th:replace="~{fragments :: topbar}"></header><main>
<a class="back" th:href="@{/bills}">← Tagihan</a><div class="page-heading"><div><p class="eyebrow" th:text="${'TAGIHAN #' + bill.id}"></p><h1>Rincian tagihan</h1><p class="muted" th:text="${@display.month(bill.period)}"></p></div><span class="badge" th:classappend="${bill.paid ? 'green' : 'amber'}" th:text="${bill.paid ? 'Lunas' : 'Belum Lunas'}"></span></div><div th:replace="~{fragments :: messages}"></div>
<div class="detail-grid"><section class="panel padded"><h2>Informasi tagihan</h2><dl class="details"><div><dt>Penghuni</dt><dd th:text="${bill.resident.name}"></dd></div><div><dt>Kamar</dt><dd th:text="${bill.resident.room.number}"></dd></div><div><dt>Jatuh tempo</dt><dd th:text="${@display.date(bill.dueDate)}"></dd></div><div><dt>Nominal sewa</dt><dd class="amount" th:text="${@display.money(bill.amount)}"></dd></div></dl>
<p class="note">Tarif satu bulan penuh, termasuk air dan listrik.</p><form th:if="${!bill.paid}" th:action="@{/bills/{id}/delete(id=${bill.id})}" method="post" data-confirm="Hapus tagihan belum lunas ini? Tindakan ini tidak menghapus data penghuni."><button class="button danger" type="submit">Hapus tagihan</button></form></section>
<section class="panel padded"><h2 th:text="${bill.paid ? 'Pembayaran tercatat' : 'Catat pembayaran'}"></h2>
<div th:if="${bill.paid}"><dl class="details"><div><dt>Tanggal pembayaran</dt><dd th:text="${@display.date(bill.paidOn)}"></dd></div><div><dt>Metode</dt><dd th:text="${bill.method}"></dd></div><div><dt>Nominal diterima</dt><dd th:text="${@display.money(bill.amount)}"></dd></div></dl><p class="note">Tagihan lunas dikunci dari perubahan dan penghapusan.</p></div>
<form th:if="${!bill.paid}" class="stack" th:action="@{/bills/{id}/pay(id=${bill.id})}" method="post" data-confirm="Pastikan uang sudah diterima sebesar nominal tagihan. Catat sebagai lunas?">
<p class="muted">Catat setelah uang diterima secara penuh.</p><label for="date">Tanggal pembayaran<input id="date" type="date" name="date" th:value="${today}" th:max="${today}" required></label><label for="method">Metode pembayaran<select id="method" name="method" required><option value="">Pilih metode</option><option>Tunai</option><option>Transfer</option></select></label><p class="note" th:text="${'Nominal diterima: ' + @display.money(bill.amount)}"></p><button class="button" type="submit">Catat lunas</button></form>
</section></div></main></div></body></html>
